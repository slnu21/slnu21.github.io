{% if site.comments.provider == "utterances" %}
<section class="comments" aria-label="댓글">
  <h2 class="sec">댓글</h2>
  <div id="utterances-container"></div>
  <script>
    (function () {
      var theme = document.documentElement.getAttribute('data-theme') === 'light'
        ? '{{ site.comments.utterances.theme_light }}'
        : '{{ site.comments.utterances.theme_dark }}';
      var s = document.createElement('script');
      s.src = 'https://utteranc.es/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.setAttribute('repo', '{{ site.comments.utterances.repo }}');
      s.setAttribute('issue-term', '{{ site.comments.utterances.issue_term }}');
      s.setAttribute('label', '{{ site.comments.utterances.label }}');
      s.setAttribute('theme', theme);
      document.getElementById('utterances-container').appendChild(s);
    })();
  </script>
</section>
{% endif %}
