<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">

  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>

  <!-- SEO / Open Graph (jekyll-seo-tag) -->
  {% seo %}

  <!-- RSS -->
  {% feed_meta %}

  <!-- 폰트 (Pretendard) -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- 스타일 -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- 파비콘 (assets/img/favicon.png 추가 시 활성) -->
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">

  <!-- 새로고침 깜빡임 방지: 저장된 테마를 즉시 적용 -->
  <script>
    (function () {
      var t = localStorage.getItem('theme')
        || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
